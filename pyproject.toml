[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "network-config-backup"
version = "0.2.0rc1"
description = "A guided terminal for private network configuration and diagnostic collections."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Carlos Alvarado"}]
dependencies = ["netmiko>=4.6,<5", "textual>=8.2.8,<9", "PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "build>=1,<2"]

[project.scripts]
ncb = "network_backup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
network_backup = ["*.tcss", "data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
